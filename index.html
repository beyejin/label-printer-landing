<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffaf4">
<meta name="description" content="오지렌 네임스티커 감열식 라벨프린터 라벨기 핑크 수업 초안. 광고 주소는 /a 와 /b 입니다.">
<title>초안 | 오지렌 네임스티커 감열식 라벨프린터 라벨기 핑크</title>
<link rel="stylesheet" href="/styles.css">
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var variant = (params.get("v") || "").toLowerCase();
  if (variant !== "a" && variant !== "b") return;
  params.delete("v");
  params.delete("export");
  var query = params.toString();
  location.replace("/" + variant + (query ? "?" + query : "") + location.hash);
})();
</script>
</head>
<body>
<p class="draft-banner">초안, 실제 광고 전 확인 필요</p>
<div class="page">
<main class="gate">
<p class="eyebrow">수업 실습 초안</p>
<h1>광고에 넣을 주소</h1>
<p class="product-name">오지렌 네임스티커 감열식 라벨프린터 라벨기 핑크</p>
<p class="lead">측정용 페이지는 아래 두 주소입니다. 이 주소(/)에서는 Meta 스크립트를 불러오지 않습니다. 예전 주소 <code>?v=a</code>, <code>?v=b</code>는 각각 /a, /b로 넘어갑니다.</p>
<a class="choice choice-a" href="/a"><span class="choice-mark">A</span><span><strong>나만의 것</strong><small>/a</small></span></a>
<a class="choice choice-b" href="/b"><span class="choice-mark">B</span><span><strong>친구랑 함께</strong><small>/b</small></span></a>
<footer class="site-foot">수업 실습용 초안입니다. 상품 사진은 각 랜딩의 빈 자리에 나중에 넣습니다.</footer>
</main>
</div>
</body>
</html>
