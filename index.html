<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffaf4">
<meta name="description" content="오지렌 네임스티커 감열식 라벨프린터 라벨기 핑크. 광고 주소는 /a 입니다.">
<title>측정용 주소 | 오지렌 네임스티커 감열식 라벨프린터 라벨기 핑크</title>
<link rel="stylesheet" href="/styles.css">
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var variant = (params.get("v") || "").toLowerCase();
  if (variant !== "a" && variant !== "b") return;
  params.delete("v");
  params.delete("export");
  var query = params.toString();
  location.replace("/" + variant + (query ? "?" + query : "") + location.hash);
})();
</script>
</head>
<body>
<div class="page">
<main class="gate">
<p class="eyebrow">측정용 주소 안내</p>
<h1>광고에 넣을 주소</h1>
<p class="product-name">오지렌 네임스티커 감열식 라벨프린터 라벨기 핑크</p>
<p class="lead">광고 주소는 <a href="/a">/a</a> 하나입니다. 이 주소(/)에서는 Meta 스크립트를 불러오지 않습니다. 예전 주소 <code>?v=a</code>, <code>?v=b</code>는 각각 /a, /b로 넘어갑니다.</p>
<a class="choice choice-a" href="/a"><span class="choice-mark">A</span><span><strong>광고 랜딩</strong><small>/a</small></span></a>
<p class="lead"><a href="/b">/b</a>는 보관용이며 광고에 쓰지 않습니다.</p>
<footer class="site-foot">이 페이지는 오지렌 공식 판매 사이트가 아닙니다. 구매는 쿠팡 상품 페이지에서 진행됩니다. 가운데 장면은 AI로 만든 예시 이미지입니다.</footer>
</main>
</div>
</body>
</html>
