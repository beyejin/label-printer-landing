<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffaf4">
<meta name="description" content="오지렌 미니 라벨프린터 수업용 A/B 랜딩. 광고는 /a 와 /b 를 사용합니다.">
<title>오지렌 미니 라벨프린터 | A/B 주소</title>
<link rel="stylesheet" href="/styles.css">
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var variant = (params.get("v") || "").toLowerCase();
  if (variant !== "a" && variant !== "b") return;
  params.delete("v");
  params.delete("export");
  var query = params.toString();
  location.replace("/" + variant + (query ? "?" + query : "") + location.hash);
})();
</script>
</head>
<body>
<div class="page">
<main class="gate">
<p class="eyebrow">수업 실습 · 오지렌 미니 라벨프린터</p>
<h1>광고에 넣을 주소</h1>
<p class="lead">측정은 아래 두 페이지에서만 합니다. 이 주소(/)에는 메타 픽셀을 넣지 않았으니 광고 세트의 도착 URL로 쓰지 마세요. 예전 주소 <code>?v=a</code>, <code>?v=b</code>는 각각 /a, /b로 넘어갑니다.</p>
<a class="choice choice-a" href="/a"><span class="choice-mark">A</span><span><strong>나만의 것</strong><small>/a</small></span></a>
<a class="choice choice-b" href="/b"><span class="choice-mark">B</span><span><strong>친구랑 함께</strong><small>/b</small></span></a>
<footer class="site-foot">수업 실습용 페이지 · 구매 버튼은 각 랜딩에 있습니다</footer>
</main>
</div>
</body>
</html>
